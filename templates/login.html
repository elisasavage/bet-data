{% extends "base.html" %}

{% block title %}Giriş - Bet Data Panel{% endblock %}

{% block body %}
<main class="login">
    {% include "_theme_toggle.html" %}

    <div class="login-card">
        <img class="i3d login-art" src="/static/icons/lock.webp" alt="" width="128" height="128">

        <h1 class="login-title">Bet Data Panel</h1>
        <p class="login-text">Devam etmek için giriş yapın.</p>

        {% if error %}
        <div class="alert" role="alert">
            <img class="i3d" src="/static/icons/warning.webp" alt="" width="28" height="28">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="login-form" method="POST" action="/auth/login">
            <div class="text-field">
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="text-field-input"
                    placeholder=" "
                    autocomplete="email"
                    required
                >
                <label for="email">E-posta</label>
            </div>

            <div class="text-field">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="text-field-input"
                    placeholder=" "
                    autocomplete="current-password"
                    required
                >
                <label for="password">Şifre</label>
            </div>

            <button type="submit" class="btn btn-block">Giriş yap</button>
        </form>
    </div>
</main>
{% endblock %}
