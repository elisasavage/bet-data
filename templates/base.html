<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f9f9ff">
    <title>{% block title %}Bet Data Panel{% endblock %}</title>

    {# Tema ilk boyamadan önce seçilir (yanıp sönme olmaz): kayıtlı tercih, yoksa sistem ayarı. #}
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111318' : '#f9f9ff';
        })();
    </script>

    <link rel="icon" type="image/webp" href="/static/icons/chart.webp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>

    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <script>
        function toggleTheme() {
            var root = document.documentElement;
            var theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = theme;
            try { localStorage.setItem('theme', theme); } catch (e) {}
            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111318' : '#f9f9ff';
            syncThemeToggle();
        }

        function syncThemeToggle() {
            var dark = document.documentElement.dataset.theme === 'dark';
            document.querySelectorAll('.theme-toggle').forEach(function (btn) {
                btn.setAttribute('aria-label', dark ? 'Açık temaya geç' : 'Koyu temaya geç');
                btn.setAttribute('title', dark ? 'Açık tema' : 'Koyu tema');
            });
        }

        syncThemeToggle();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
